<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LayMesh · 多页放映验证</title>
<style>body{max-width:900px;margin:40px auto;padding:0 20px;font:16px system-ui;background:#f4f6fa;color:#243b53}button{font:inherit;padding:8px 14px;margin:8px 8px 8px 0;cursor:pointer}p{line-height:1.7}pre{white-space:pre-wrap;overflow-wrap:anywhere}#state{min-height:48px}</style>
<h1>多页放映验证</h1><p><a href="?deck=academic">32 页学术演示 · 97 种动画</a> · <a href="?deck=stress">第 8–10 档压力场景</a> · <a href="?deck=terminal">退出与移动终态</a> · <a href="?deck=linked">自动衔接</a></p><p id="description">首页就绪即可放映，后续页面后台准备。放映中使用点击、滚轮、空格、方向键和右键菜单。退出后可下载包含准备时间和每次切页耗时的结果。</p>
<p>“采集五轮切页”固定使用 3840×2160 绘制缓冲区。全程没有预播或排除轮次；驻留状态和恢复耗时分别记录。结果观察 Worker 完成绘制后的刷新回调，不代表显示器扫描输出。</p>
<div id="state" role="status">正在准备首页…</div><div id="controls"></div><button id="measure" disabled>采集五轮切页</button><button id="save" disabled>下载结果</button><pre id="result"></pre>
<script type="module">
const base=new URL(location.pathname.endsWith('/tests/skia/presentation.html')?'../../site/live/':'./site/live/',location);
const {Presentation}=await import(new URL('presentation.mjs',base));
const {webPresentationProvider}=await import(new URL('presentation-web.mjs',base));
const {stressCases,stressFiles}=await import(new URL('stress-scenes.mjs',location));
const state=document.querySelector('#state'),files={},kind=new URLSearchParams(location.search).get('deck')||'academic',academic=kind==='academic';let entry,workload;
if(academic){
 const folder=new URL('../../tests/presentation/academic/',base),response=await fetch(new URL('manifest.json',folder));if(!response.ok)throw Error('Academic fixture manifest unavailable');workload=await response.json();
 await Promise.all(workload.files.map(async file=>{const r=await fetch(new URL(file,folder));if(!r.ok)throw Error(`Academic source unavailable: ${file}`);files['tests/presentation/academic/'+file]=await r.text();}));
 const css=await fetch(new URL('../../tests/animation/vendor/animate.css',base));if(!css.ok)throw Error('Animate.css fixture unavailable');files['tests/animation/vendor/animate.css']=await css.text();entry='tests/presentation/academic/report.laydoc';
 document.querySelector('#description').textContent=`热扩散数值验证：24 页正文 + 8 页动画附录，${workload.totals.charts} 张图表、${workload.totals.formulas} 个公式，覆盖 97 种 Animate.css 效果。数据由解析公式和有限差分计算生成，非实验数据。首页就绪后点击“放映”；滚轮向下推进、向上回退。`;
}else if(kind==='terminal'||kind==='linked'){entry='tests/presentation/'+(kind==='linked'?'linked':'terminal-state')+'.lay';const response=await fetch(new URL('../../'+entry,base));if(!response.ok)throw Error('Terminal-state fixture unavailable');files[entry]=await response.text();}else{const lines=['d=document()'];for(const spec of stressCases.slice(7)){const page=stressFiles(spec);Object.assign(files,page.files);lines.push(`d.add(page(src="${page.entry}",id="${spec.id}",name="${spec.label}"))`);}files['stress.laydoc']=lines.join('\n');entry='stress.laydoc';}
const editor={files,entry,loadedFonts:[],module:{dataset:{modified:'true'}}},provider=webPresentationProvider(editor,base,{concurrency:Number(new URLSearchParams(location.search).get('workers'))||undefined});let report;
const presentation=new Presentation({base,provider:args=>provider({...args,onProgress:p=>{state.textContent=`${p.completed===p.total?'全部就绪':p.completed?'可以放映 · 后台准备':'正在准备首页'} ${p.completed}/${p.total} 页${p.failed?' · '+p.failed+' 页失败':''} · ${p.page||''}`;args.onProgress(p);}}),onExit:metrics=>{report={workload:academic?'academic-32-v2':kind==='terminal'?'terminal-state-v1':kind==='linked'?'linked-v1':'stress-8-10',definition:'No pre-play. Input to completed draw observed on the next animation-frame callback; not physical scan-out.',hardwareAcceptance:false,buffer:[presentation.canvas.width,presentation.canvas.height],screen:[screen.width,screen.height],dpr:devicePixelRatio,...structuredClone(metrics)};document.querySelector('#save').disabled=false;const ms=value=>Number.isFinite(value)?value.toFixed(1)+' ms':'—';document.querySelector('#result').textContent=[`放映已结束 · ${report.backend||'未开始绘制'}`,`首页准备 ${ms(report.firstPageMs)} · 全文准备 ${ms(report.prepareMs)}`,`绘制 ${report.frames} 帧 · 切页 ${report.transitions.length} 次`,`完整逐步统计请点击“下载结果”。可以再次放映。`].join('\n');}});
document.querySelector('#controls').append(presentation.button);window.presentation=presentation;
presentation.prepare().then(()=>{state.textContent='首页已准备好，可以开始放映；后续页面后台准备。';document.querySelector('#measure').disabled=false;},e=>{state.textContent=e.message;});
document.querySelector('#measure').onclick=async()=>{const button=document.querySelector('#measure');button.disabled=true;const dimensions=presentation.dimensions.bind(presentation);presentation.dimensions=()=>({width:3840,height:2160});presentation.metrics={transitions:[],frames:0,prepareMs:presentation.metrics.prepareMs,preparation:presentation.metrics.preparation};try{await presentation.open();if(!presentation.ready)throw Error(presentation.message.textContent);for(let round=0;round<5&&presentation.opened;round++)for(const index of academic?[0,1,2,17,24,31,30,29,0]:[0,1,2,1,0]){if(!presentation.opened)break;await presentation.go(index);await presentation.preload;const row=presentation.metrics.transitions.at(-1);if(row)row.round=round+1;}await presentation.close();}catch(e){state.textContent=e.message;}finally{presentation.dimensions=dimensions;button.disabled=false;}};
document.querySelector('#save').onclick=()=>{const link=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));link.href=url;link.download='laymesh-presentation.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
window.addEventListener('pagehide',()=>presentation.dispose());
</script></html>
