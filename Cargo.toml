[workspace]
resolver = "2"
members = ["crates/laymesh-core", "crates/laymesh-render", "crates/laymesh-cli", "crates/laymesh-language", "crates/laymesh-wasm"]

[patch.crates-io]
# Keep RaTeX's workspace path dependencies on one source and immutable revision.
ratex-layout = { git = "https://github.com/muxkin/RaTeX.git", rev = "9e03b1c0f365a15f51e68649311365c0d62842e1" }
ratex-parser = { git = "https://github.com/muxkin/RaTeX.git", rev = "9e03b1c0f365a15f51e68649311365c0d62842e1" }
ratex-types = { git = "https://github.com/muxkin/RaTeX.git", rev = "9e03b1c0f365a15f51e68649311365c0d62842e1" }
ratex-font = { git = "https://github.com/muxkin/RaTeX.git", rev = "9e03b1c0f365a15f51e68649311365c0d62842e1" }
ratex-katex-fonts = { git = "https://github.com/muxkin/RaTeX.git", rev = "9e03b1c0f365a15f51e68649311365c0d62842e1" }
ratex-lexer = { git = "https://github.com/muxkin/RaTeX.git", rev = "9e03b1c0f365a15f51e68649311365c0d62842e1" }

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
laymesh-core = { path = "crates/laymesh-core", default-features = false }
laymesh-render = { path = "crates/laymesh-render" }
laymesh-language = { path = "crates/laymesh-language" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
