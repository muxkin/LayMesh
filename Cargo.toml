[workspace]
resolver = "2"
members = ["crates/laymesh-core", "crates/laymesh-render", "crates/laymesh-cli", "crates/laymesh-language", "crates/laymesh-wasm"]
exclude = ["vendor/ratex-layout"]

[patch.crates-io]
ratex-layout = { path = "vendor/ratex-layout" }

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
laymesh-core = { path = "crates/laymesh-core", default-features = false }
laymesh-render = { path = "crates/laymesh-render" }
laymesh-language = { path = "crates/laymesh-language" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
