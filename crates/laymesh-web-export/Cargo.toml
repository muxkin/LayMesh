[package]
name = "laymesh-web-export"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
laymesh-render = { path = "../laymesh-render", default-features = false, features = ["portable-export"] }
serde_json.workspace = true
wasm-bindgen = "0.2"
svg2pdf = { version = "=0.13.0", default-features = false, features = ["image", "filters"] }
pdf-writer = "=0.12.1"
