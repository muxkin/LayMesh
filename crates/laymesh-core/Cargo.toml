[package]
name = "laymesh-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["system-fonts"]
system-fonts = ["fontdb/fs", "fontdb/fontconfig"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
fontdb = { version = "0.23", default-features = false, features = ["std"] }
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-segmentation = "1.12"
unicode-linebreak = "0.1"
unicode-bidi = "0.3"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-font = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
kurbo = "0.13"
i_overlay = "4.0"
contour = { version = "=0.13.1", default-features = false }
svgtypes = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif", "ico", "pnm", "tga"] }
tiff = "=0.11.3"
moxcms = "=0.8.1"
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"
base64 = "0.22"
csv = "1.3"
roxmltree = "0.21"
regex = "1"
sha2 = "0.10"
