name: Python wheels and PyPI

on:
  pull_request:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r release/build-requirements.txt
      - run: python scripts/check-release.py
      - name: Verify stable tag, versions and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/github-release.py check-tag --tag "$GITHUB_REF_NAME"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils mupdf-tools
      - run: python -m pip install -e './python' pillow
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
      - run: python scripts/test-contracts.py
      - run: python scripts/build-api-reference.py --check
      - run: python scripts/build-topic-walkthroughs.py --check
      - run: python scripts/check-feature-docs.py
      - run: python scripts/build-docs-media.py --check

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-15-intel, target: darwin-x64}
          - {os: macos-14, target: darwin-arm64}
          - {os: windows-2022, target: win-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo build --release --locked -p laymesh-cli
      - run: python -m pip install -r release/build-requirements.txt
      - run: python scripts/collect-licenses.py
      - run: python scripts/build-python-wheel.py --output release/dist
      - run: python scripts/check-python-wheels.py release/dist
      - run: python -m twine check --strict release/dist/*.whl
        shell: bash
      - name: Install the wheel, never the checkout
        shell: bash
        run: |
          python -m pip install "$(python -c "from pathlib import Path; print(next(Path('release/dist').glob('*.whl')))")"
      - run: python scripts/smoke-python-wheel.py --examples examples
      - run: python -m unittest discover -s python/tests -v
      - name: Build and audit Windows, Linux and macOS VS Code packages
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "win-x64" ]; then
            binary=target/release/laymesh.exe
            platform=win32-x64
          else
            binary=target/release/laymesh
            platform="${{ matrix.target }}"
          fi
          version=$(python -c "import json; print(json.load(open('extensions/vscode/package.json'))['version'])")
          python scripts/build-editors.py --binary "$binary" --extension-dir release/staging/editor
          python scripts/package-editor.py --extension-dir release/staging/editor --target "$platform" --output "release/editors/laymesh-$version-$platform.vsix"
          python scripts/check-editor.py "release/editors/laymesh-$version-$platform.vsix" --target "$platform" --binary "$binary" --marketplace
      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.target }}
          path: release/editors/*.vsix
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: release/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  python-compatibility:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        platform:
          - {os: ubuntu-24.04, target: linux-x64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-15-intel, target: darwin-x64}
          - {os: macos-14, target: darwin-arm64}
          - {os: windows-2022, target: win-x64}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform.target }}
          path: release/dist
      - name: Install the platform wheel
        shell: bash
        run: |
          python -m pip install "$(python -c "from pathlib import Path; print(next(Path('release/dist').glob('*.whl')))")"
      - run: python scripts/smoke-python-wheel.py

  review:
    needs: [core, wheels, python-compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r release/build-requirements.txt
      - run: python scripts/check-release.py
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: release/dist
      - run: python scripts/check-python-wheels.py release/dist --all-targets --checksums release/SHA256SUMS
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-*
          merge-multiple: true
          path: release/editors
      - name: Audit all five stable VSIX packages against their wheel engines
        run: >-
          python scripts/marketplace-release.py audit
          --source . --version "$(python scripts/check-release.py | awk '{print $NF}')"
          --wheels release/dist --vsix release/editors --checksums release/SHA256SUMS
          --report release/editor-audit.json
      - name: Assemble reviewed GitHub release assets
        run: |
          mkdir -p release/assets
          cp release/dist/*.whl release/editors/*.vsix release/assets/
          cd release/assets
          sha256sum *.whl *.vsix > SHA256SUMS

      - run: python -m twine check --strict release/dist/*.whl
      - name: Require an existing human approval gate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/pypi" > "$RUNNER_TEMP/pypi-environment.json"
          python -c "import json,os; from pathlib import Path; e=json.loads((Path(os.environ['RUNNER_TEMP'])/'pypi-environment.json').read_text()); assert any(r.get('type')=='required_reviewers' and r.get('reviewers') for r in e.get('protection_rules',[])), 'Configure required reviewers on the pypi environment before publishing'"
      - name: Review summary
        run: |
          echo 'All five wheels passed native installation/export checks on Python 3.10, 3.13 and 3.14.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Windows, Linux and macOS VSIX packages use the same release version and passed native platform audits.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review these exact artifacts before approving the pypi environment.' >> "$GITHUB_STEP_SUMMARY"
          cat release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-python-release
          path: |
            release/dist/*.whl
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-github-release
          path: release/assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [core, review]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/laymesh/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-python-release
          path: reviewed
      - name: Verify reviewed artifacts
        working-directory: reviewed/dist
        run: sha256sum --check ../SHA256SUMS
      - name: Refuse conflicting existing PyPI wheels
        run: python scripts/check-pypi-release.py --wheels reviewed/dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: reviewed/dist/
          skip-existing: true
      - name: Verify all published wheel hashes
        run: python scripts/check-pypi-release.py --wheels reviewed/dist --complete

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r release/build-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-github-release
          path: reviewed/assets
      - name: Publish and verify reviewed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github-release.py publish --tag "$GITHUB_REF_NAME" --assets reviewed/assets --repo "$GITHUB_REPOSITORY"
