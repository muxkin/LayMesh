name: acceptance
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils mupdf-tools pkg-config libfontconfig1-dev libfreetype-dev libbrotli-dev libbz2-dev libexpat1-dev libpng-dev zlib1g-dev
      - if: runner.os == 'macOS'
        run: brew install poppler mupdf-tools ffmpeg
      - if: runner.os == 'Windows'
        run: choco install poppler mupdf ffmpeg -y
      - run: python -m pip install -e './python' pillow
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: python scripts/build-web-export.py
      - run: python scripts/test-contracts.py
      - run: cargo build --locked --release -p laymesh-cli
      - run: python -m pip install -e './python' pillow
      - run: python -m unittest discover -s python/tests -v
      - run: python scripts/test-pptx-export.py
      - run: node scripts/test-editor-pptx.cjs
      - run: node scripts/test-editor-web-export.cjs
      - run: python scripts/check-gallery-docs.py
      - run: python scripts/build-api-reference.py --check
      - run: python scripts/build-style-animation-docs.py --check
      - run: python scripts/build-library-docs.py --check
      - run: node scripts/build-dashboard-data.mjs --check
      - run: python scripts/build-topic-walkthroughs.py --check
      - run: python scripts/check-feature-docs.py
      - run: python scripts/build-editors.py
      - run: python scripts/package-editor.py --output release/dist/laymesh.vsix
      - run: python scripts/check-editor.py release/dist/laymesh.vsix
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r release/docs-requirements.txt
      - name: Install native libraries for CSS catalog and raster parity
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype-dev libbrotli-dev libbz2-dev libexpat1-dev libpng-dev zlib1g-dev poppler-utils
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: python scripts/build-api-reference.py --check
      - run: python scripts/build-style-animation-docs.py --check
      - run: python scripts/build-library-docs.py --check
      - run: node scripts/build-dashboard-data.mjs --check
      - run: python scripts/build-topic-walkthroughs.py --check
      - run: python scripts/check-feature-docs.py
      - run: python scripts/build-docs.py
      - run: python scripts/build-docs.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-save playwright@1.62.1
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Presentation timing and preparation contracts
        run: |
          node scripts/test-presentation-clock.mjs
          node scripts/test-presentation-wheel.mjs
          node scripts/test-presentation-session.mjs
          node scripts/test-presenter-mirror.mjs
          node --experimental-vm-modules scripts/test-page-previews.mjs
          node scripts/test-presentation-native-scheduling.cjs
          node scripts/test-preview-player.mjs
      - name: CSS animation and real presentation browser regressions
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-tests/node_modules/playwright
        run: |
          python scripts/build-web-export.py
          cargo build --locked --release -p laymesh-core --example animation_reference
          cargo build --locked --release -p laymesh-cli
          # Match the normal browser engine used by the app. Headless Shell
          # 151 drops native wheel scrolling in fullscreen overflow menus.
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')"
          python scripts/serve-preview.py --bind 127.0.0.1 --port 8769 > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node scripts/test-web-export.cjs "$RUNNER_TEMP/browser-results/web-export"
          node scripts/test-web-static-export.cjs "$RUNNER_TEMP/browser-results/static-export"
          python scripts/check-web-static-export.py "$RUNNER_TEMP/browser-results/static-export"
          python scripts/check-web-export-budget.py
          node scripts/test-presenter.cjs "$RUNNER_TEMP/browser-results/presenter"
          node scripts/test-presenter-startup.cjs "$RUNNER_TEMP/browser-results/presenter/notes.zip.html" "$RUNNER_TEMP/browser-results/presenter/startup.json"
          node scripts/test-page-thumbnails.cjs "$RUNNER_TEMP/browser-results/presenter"
          node scripts/test-presentation-pages.cjs "$RUNNER_TEMP/browser-results/presenter/notes.zip.html" "$RUNNER_TEMP/browser-results/presenter/pages"
          node scripts/test-web-vector-export.cjs "$RUNNER_TEMP/browser-results/vector-export"
          python scripts/check-web-vector-export.py "$RUNNER_TEMP/browser-results/vector-export"
          node scripts/test-workspace-files.mjs
          node scripts/test-workspace-interactions.cjs "$RUNNER_TEMP/browser-results/workspace-interactions"
          LAYMESH_TEST_HOST=127.0.0.1 node scripts/test-page-transitions.cjs "$RUNNER_TEMP/browser-results/page-transitions"
          node scripts/test-laydoc-transitions.cjs "$RUNNER_TEMP/browser-results/laydoc" http://127.0.0.1:8769/
          node scripts/test-web-workspace.cjs "$RUNNER_TEMP/browser-results/web-workspace"
          node scripts/test-web-fonts-viewport.cjs "$RUNNER_TEMP/browser-results/web-fonts-viewport"
          node scripts/test-animation-browser.cjs "$RUNNER_TEMP/browser-results/css"
          node scripts/test-css-browser.cjs http://127.0.0.1:8769/ "$RUNNER_TEMP/browser-results/styles"
          node scripts/test-css-library-presentation.cjs http://127.0.0.1:8769/ "$RUNNER_TEMP/browser-results/style-presentation"
          node scripts/test-presentation-controls.cjs http://127.0.0.1:8769/ "$RUNNER_TEMP/browser-results/controls"
          node scripts/test-preview-presentation.cjs http://127.0.0.1:8769/ "$RUNNER_TEMP/browser-results/preview"
          node scripts/test-presentation-streaming.cjs http://127.0.0.1:8769/ "$RUNNER_TEMP/browser-results/streaming"
          node scripts/test-academic-presentation.cjs 'http://127.0.0.1:8769/presentation-test.html?deck=academic' "$RUNNER_TEMP/browser-results/academic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regressions
          path: ${{ runner.temp }}/browser-results
          if-no-files-found: ignore
