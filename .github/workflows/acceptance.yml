name: acceptance
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils mupdf-tools
      - if: runner.os == 'macOS'
        run: brew install poppler mupdf-tools
      - if: runner.os == 'Windows'
        run: choco install poppler mupdf -y
      - run: python -m pip install -e './python' pillow
      - run: python scripts/test-contracts.py
      - run: cargo build --locked --release -p laymesh-cli
      - run: python -m pip install -e './python' pillow
      - run: python -m unittest discover -s python/tests -v
      - run: python scripts/test-pptx-export.py
      - run: node scripts/test-editor-pptx.cjs
      - run: python scripts/check-gallery-docs.py
      - run: python scripts/build-api-reference.py --check
      - run: python scripts/build-topic-walkthroughs.py --check
      - run: python scripts/check-feature-docs.py
      - run: python scripts/build-editors.py
      - run: python scripts/package-editor.py --output release/dist/laymesh.vsix
      - run: python scripts/check-editor.py release/dist/laymesh.vsix
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r release/docs-requirements.txt
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: python scripts/build-api-reference.py --check
      - run: python scripts/build-topic-walkthroughs.py --check
      - run: python scripts/check-feature-docs.py
      - run: python scripts/build-docs.py
      - run: python scripts/build-docs.py --check
