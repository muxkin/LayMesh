name: acceptance
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils mupdf-tools pkg-config libfontconfig1-dev libfreetype-dev libbrotli-dev libbz2-dev libexpat1-dev libpng-dev zlib1g-dev
      - if: runner.os == 'macOS'
        run: brew install poppler mupdf-tools
      - if: runner.os == 'Windows'
        run: choco install poppler mupdf -y
      - run: python -m pip install -e './python' pillow
      - run: python scripts/test-contracts.py
      - run: cargo build --locked --release -p laymesh-cli
      - run: python -m pip install -e './python' pillow
      - run: python -m unittest discover -s python/tests -v
      - run: python scripts/test-pptx-export.py
      - run: node scripts/test-editor-pptx.cjs
      - run: python scripts/check-gallery-docs.py
      - run: python scripts/build-api-reference.py --check
      - run: python scripts/build-topic-walkthroughs.py --check
      - run: python scripts/check-feature-docs.py
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: python scripts/build-editors.py
      - run: python scripts/package-editor.py --output release/dist/laymesh.vsix
      - run: python scripts/check-editor.py release/dist/laymesh.vsix
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r release/docs-requirements.txt
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: python scripts/build-api-reference.py --check
      - run: python scripts/build-topic-walkthroughs.py --check
      - run: python scripts/check-feature-docs.py
      - run: python scripts/build-docs.py
      - run: python scripts/build-docs.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-save playwright@1.62.1
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Presentation timing and preparation contracts
        run: |
          node scripts/test-presentation-clock.mjs
          node scripts/test-presentation-wheel.mjs
          node scripts/test-presentation-session.mjs
          node scripts/test-presentation-native-scheduling.cjs
      - name: CSS animation and real presentation browser regressions
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-tests/node_modules/playwright
        run: |
          cargo build --locked --release -p laymesh-core --example animation_reference
          # Match the normal browser engine used by the app. Headless Shell
          # 151 drops native wheel scrolling in fullscreen overflow menus.
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')"
          python scripts/serve-preview.py --bind 127.0.0.1 --port 8769 > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node scripts/test-animation-browser.cjs "$RUNNER_TEMP/browser-results/css"
          node scripts/test-presentation-controls.cjs http://127.0.0.1:8769/ "$RUNNER_TEMP/browser-results/controls"
          node scripts/test-presentation-streaming.cjs http://127.0.0.1:8769/ "$RUNNER_TEMP/browser-results/streaming"
          node scripts/test-academic-presentation.cjs 'http://127.0.0.1:8769/presentation-test.html?deck=academic' "$RUNNER_TEMP/browser-results/academic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regressions
          path: ${{ runner.temp }}/browser-results
          if-no-files-found: ignore
