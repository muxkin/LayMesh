<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>公式测试集 · LayMesh</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="./">LayMesh</a>
    <span class="version">RaTeX 0.1.14 · 完整用例</span>
    <a class="download" href="data.json" download="ratex-complete-results.json">下载结果 JSON</a>
  </header>
  <aside class="sidebar" aria-label="测试类别">
    <h2>测试类别</h2>
    <nav id="categories"></nav>
    <button class="source-button" id="provenance-button">来源与完整性</button>
  </aside>
  <main>
    <h1>公式测试集</h1>
    <p class="inventory" id="inventory">正在读取完整测试集…</p>
    <p class="intro">对比数学字体的实际渲染结果。启用文本回退时，公式文字使用统一正文列表；详情可查看实际字体。</p>
    <form class="toolbar" id="filters" role="search">
      <label class="search"><span class="sr-only">搜索公式源码或编号</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="搜索公式源码或编号" autocomplete="off"></label>
      <label><span class="sr-only">渲染结果筛选</span><select id="status"><option value="all">全部结果</option><option value="rendered">全部已渲染</option><option value="failed">有失败或占位</option><option value="font_glyph_missing">字体缺字</option><option value="parse_rejected">解析不支持</option><option value="policy_rejected">禁止命令</option><option value="fallback">文本回退 / 占位</option><option value="invalid_geometry">尺寸异常</option></select></label>
      <div class="segmented" aria-label="公式模式"><button type="button" data-style="display" aria-pressed="true">独立公式</button><button type="button" data-style="inline" aria-pressed="false">行内公式</button></div>
      <label class="size-control">字号<input id="size" type="range" min="16" max="72" step="2" value="24"><output id="size-output" for="size">24px</output></label>
      <label class="page-size">每页<select id="page-size"><option value="20">20条</option><option value="40">40条</option><option value="100">100条</option></select></label>
    </form>
    <div class="comparison-options">
      <fieldset id="font-options"><legend>对照字体</legend></fieldset>
      <label class="baseline-option"><input type="checkbox" id="baselines">显示基线</label>
      <div class="segmented" aria-label="文本字体策略"><button type="button" data-text="1" aria-pressed="true">启用文本回退</button><button type="button" data-text="0" aria-pressed="false">仅数学字体</button></div>
    </div>
    <div class="results-summary"><span id="result-count" role="status" aria-live="polite">加载中…</span><span>已渲染表示完成解析与导出，请检查实际排版。</span></div>
    <p class="mobile-scroll-hint">左右滑动查看字体对照，点详情可逐套放大。</p>
    <div class="table-scroll" id="table-scroll" tabindex="0" aria-label="公式字体对照，可横向滚动">
      <table id="comparison"><thead id="table-head"></thead><tbody id="rows"><tr><td class="loading">正在加载公式与渲染结果…</td></tr></tbody></table>
    </div>
    <nav class="pagination" aria-label="分页"><button id="previous" disabled>← 上一页</button><span id="page-info"></span><label>跳至<input id="page-jump" type="number" min="1" value="1" aria-label="跳至页码">页</label><button id="next" disabled>下一页 →</button></nav>
    <p class="footnote" id="snapshot-note"></p>
  </main>
  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <header class="dialog-header"><h2 id="detail-title"></h2><button class="close-button" data-close aria-label="关闭详情">×</button></header>
    <div class="dialog-body"><p id="detail-label"></p><pre id="detail-source"></pre><div class="detail-actions"><button id="copy-source">复制源码</button><a id="original-source" target="_blank" rel="noreferrer">原始文件 ↗</a><label>放大字号<input id="detail-size" type="range" min="24" max="128" step="2" value="48"><output id="detail-size-output">48px</output></label></div><div id="detail-renders"></div></div>
  </dialog>
  <dialog id="provenance-dialog" aria-labelledby="provenance-title"><header class="dialog-header"><h2 id="provenance-title">来源与完整性</h2><button class="close-button" data-close aria-label="关闭来源说明">×</button></header><div class="dialog-body" id="provenance-content"></div></dialog>
  <noscript>请启用 JavaScript 浏览测试集。完整结果可直接下载 <a href="data.json">JSON</a>。</noscript>
</body>
</html>
